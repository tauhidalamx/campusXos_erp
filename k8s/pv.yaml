apiVersion: v1
kind: PersistentVolume
metadata:
  name: campusx-pv
  labels:
    type: local
spec:
  storageClassName: manual
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/mnt/data/campusx"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: campusx-pvc
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
