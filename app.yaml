spec_version: 1
name: campusx-university-erp
region: nyc

services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    http_port: 5000
    instance_count: 1
    instance_size_slug: basic-xs
    routes:
      - path: /
    health_check:
      http_path: /api/health
      initial_delay_seconds: 15
      period_seconds: 10
      response_timeout_seconds: 5
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: DATABASE_PATH
        value: /tmp/database.sqlite
