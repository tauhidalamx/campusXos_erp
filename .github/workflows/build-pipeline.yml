name: CampusX OS - Master Build & Verification CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build libgl1-mesa-dev xclip

    - name: Run CampusX Setup
      run: |
        chmod +x campusx campusx.py
        ./campusx setup

    - name: Run Diagnostics (Doctor)
      run: |
        ./campusx doctor

    - name: Run Test Suites
      run: |
        ./campusx test

    - name: Compile and Build Targets
      run: |
        ./campusx build
